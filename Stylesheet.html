<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --pastel-pink: #f9a8d4;
    --pastel-pink-dark: #ec4899;
    --pastel-purple: #c4b5fd;
    --pastel-purple-dark: #a78bfa;
    --pastel-blue: #93c5fd;
    --pastel-blue-light: #dbeafe;
    --pastel-mint: #5eead4;
    --pastel-mint-light: #ccfbf1;
    --pastel-peach: #fdba74;
    --pastel-peach-light: #ffedd5;
    --pastel-rose: #fb7185;
    --pastel-rose-light: #ffe4e6;
    --text-main: #4a3b52;
    --text-soft: #8b7d92;
  }

  * { box-sizing: border-box; }
  body {
    font-family: 'Sarabun', 'Segoe UI', sans-serif;
    background: #f3effc;
    margin: 0;
    padding: 24px;
    color: var(--text-main);
  }
  h1, h2, h3 { font-family: 'Mitr', 'Sarabun', sans-serif; }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .topbar h1 { font-size: 20px; margin: 0; color: var(--pastel-pink-dark); }
  .topbar .user-info { font-size: 13px; color: var(--text-soft); }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .subject-card {
    background: #fff;
    border-radius: 16px;
    padding: 16px 18px;
    box-shadow: 0 2px 10px rgba(167,139,250,0.12);
    border-left: 5px solid var(--pastel-purple-dark);
  }
  .subject-card h3 { margin: 0 0 6px; font-size: 16px; }
  .subject-card p { margin: 2px 0; font-size: 13px; color: var(--text-soft); }
  .subject-card .actions { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }

  button, .btn {
    background: var(--pastel-purple-dark);
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 0 2px 6px rgba(167,139,250,0.35);
  }
  button.secondary { background: #f3f0ff; color: #7c3aed; box-shadow: none; }
  button.info { background: var(--pastel-blue-light); color: #1d4ed8; box-shadow: none; }
  button.warning { background: #fde68a; color: #92400e; box-shadow: 0 2px 6px rgba(253,230,138,0.5); }
  button.success { background: var(--pastel-mint-light); color: #0f766e; box-shadow: 0 2px 6px rgba(94,234,212,0.4); }
  button.danger { background: var(--pastel-rose); color: #fff; box-shadow: 0 2px 6px rgba(251,113,133,0.3); }
  button:hover { opacity: 0.9; }

  .modal-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(74,59,82,0.35);
    align-items: center; justify-content: center;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: #fff;
    border-radius: 18px;
    padding: 22px;
    width: 360px;
    max-width: 90vw;
    max-height: 88vh;
    overflow-y: auto;
    box-shadow: 0 8px 28px rgba(167,139,250,0.25);
  }
  .modal h2 { margin-top: 0; font-size: 16px; color: var(--pastel-pink-dark); }
  .modal label { display: block; font-size: 13px; margin: 10px 0 4px; color: var(--text-soft); }
  .modal input, .modal select {
    width: 100%; padding: 8px; border-radius: 10px; border: 1px solid #ecdff5;
    font-family: inherit;
  }
  .modal input:focus, .modal select:focus { outline: none; border-color: var(--pastel-purple-dark); }
  .modal .modal-actions {
    margin-top: 16px; display: flex; justify-content: flex-end; gap: 8px;
  }

  .empty-state { text-align: center; color: var(--text-soft); padding: 60px 0; }

  /* dropdown ทั่วไปที่ไม่ได้อยู่ใน .modal เช่น ตัวกรองปี/เทอม */
  .filter-select {
    appearance: none; -webkit-appearance: none; -moz-appearance: none;
    background: #faf5ff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%23a78bfa'/></svg>") no-repeat right 14px center;
    color: var(--text-main);
    border: 1.5px solid #e5d9ee;
    border-radius: 20px;
    padding: 8px 34px 8px 16px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
  }
  .filter-select:focus { outline: none; border-color: var(--pastel-purple-dark); }

  /* ปุ่มและ input ให้แตะง่ายขึ้นบนมือถือ */
  button, .btn, input, select { min-height: 40px; }
  input, select { font-size: 15px; } /* กัน iOS Safari zoom เข้าอัตโนมัติตอนแตะช่องกรอก (ต้อง >=16px แต่ 15px ก็ลดปัญหาได้มาก) */

  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .table-scroll table { min-width: 480px; }

  @media (max-width: 640px) {
    body { padding: 14px; }
    .topbar { flex-direction: column; align-items: flex-start; gap: 6px; }
    .topbar h1 { font-size: 18px; }
    .topbar .user-info { font-size: 12px; line-height: 1.8; }
    .card-grid { grid-template-columns: 1fr; }
    .modal { width: 100%; padding: 16px; }
    button, .btn { padding: 10px 12px; font-size: 13px; }
    th, td { padding: 8px 8px; font-size: 12px; }
  }

  /* ===== Loading states ===== */

  /* 1) Skeleton screen: บล็อกเทาไล่เฉดวิ่ง ใช้แทนเนื้อหาที่ยังโหลดไม่เสร็จ */
  @keyframes skeleton-shimmer {
    0% { background-position: -200px 0; }
    100% { background-position: 200px 0; }
  }
  .skeleton {
    background: linear-gradient(90deg, #f1ecf9 25%, #e4d9f5 37%, #f1ecf9 63%);
    background-size: 400px 100%;
    animation: skeleton-shimmer 1.4s ease-in-out infinite;
    border-radius: 8px;
    display: block;
  }
  .skeleton-text { height: 13px; margin: 6px 0; width: 100%; }
  .skeleton-text.short { width: 40%; }
  .skeleton-card { height: 120px; border-radius: 16px; }
  .skeleton-row td { padding: 10px 12px; }
  .skeleton-row .skeleton { height: 14px; }

  /* 2) Circular spinner: วงกลมหมุน ใช้เป็นตัวโหลดทั่วไปแบบง่ายๆ */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    display: inline-block;
    width: 22px; height: 22px;
    border: 3px solid #e5d9ee;
    border-top-color: var(--pastel-purple-dark);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
  }
  .spinner.small { width: 14px; height: 14px; border-width: 2px; }
  .spinner-center { display: flex; align-items: center; justify-content: center; padding: 40px 0; gap: 10px; color: var(--text-soft); font-size: 13px; }

  /* 3) Progress bar: แถบความคืบหน้า (ใช้แบบ indeterminate ก็ได้เมื่อไม่รู้ % ที่แท้จริง) */
  .progress-track {
    width: 100%; height: 8px; background: #f1ecf9; border-radius: 6px; overflow: hidden; margin: 10px 0;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--pastel-pink), var(--pastel-purple-dark));
    border-radius: 6px; width: 0%; transition: width 0.3s ease;
  }
  .progress-track.indeterminate .progress-fill {
    width: 40% !important; animation: progress-indeterminate 1.1s ease-in-out infinite;
  }
  @keyframes progress-indeterminate {
    0% { margin-left: -40%; }
    100% { margin-left: 100%; }
  }

  /* 4) Button loader: ปุ่มที่กำลังทำงานอยู่ แสดง spinner แทนข้อความ กันกดซ้ำ */
  button.btn-loading, .btn.btn-loading {
    color: transparent !important; pointer-events: none; position: relative; opacity: 0.85;
  }
  button.btn-loading::after, .btn.btn-loading::after {
    content: ''; position: absolute; top: 50%; left: 50%; width: 16px; height: 16px;
    margin: -8px 0 0 -8px; border: 2.5px solid rgba(255,255,255,0.5); border-top-color: #fff;
    border-radius: 50%; animation: spin 0.6s linear infinite;
  }
  button.secondary.btn-loading::after, button.warning.btn-loading::after { border-color: rgba(124,58,237,0.3); border-top-color: #7c3aed; }

  /* 5) Full-screen overlay: ใช้ตอนมีงานหนักที่บล็อกทั้งหน้าจอชั่วคราว (เช่น นำเข้า Excel, โหลดรายงาน) */
  #globalOverlay {
    display: none; position: fixed; inset: 0; background: rgba(74,59,82,0.45);
    z-index: 9999; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
  }
  #globalOverlay.show { display: flex; }
  #globalOverlay .spinner { width: 40px; height: 40px; border-width: 4px; }
  #globalOverlay .overlay-text { color: #fff; font-size: 14px; font-weight: 500; }
</style>

<script>
  // ---------- Loading helpers ใช้ร่วมกันได้ทุกหน้า ----------
  // หมายเหตุ: สร้าง overlay ด้วย JS แทนการเขียน <div> ตรงๆ เพราะไฟล์นี้ถูก include กลาง <head> ของทุกหน้า
  // ถ้าเขียน <div> ดิบไว้ตรงนี้ เบราว์เซอร์จะตัด <head> ก่อนกำหนดแล้วโยนเนื้อหาที่เหลือไปเป็น <body> ทันที (พังทั้งหน้า)
  document.addEventListener('DOMContentLoaded', function() {
    if (document.getElementById('globalOverlay')) return;
    const overlay = document.createElement('div');
    overlay.id = 'globalOverlay';
    overlay.innerHTML = '<div class="spinner"></div>' +
      '<div class="overlay-text" id="globalOverlayText">กำลังทำงาน...</div>' +
      '<div class="progress-track indeterminate" id="globalOverlayProgress" style="display:none;width:220px;"><div class="progress-fill"></div></div>';
    document.body.appendChild(overlay);
  });

  // ปุ่ม: สลับสถานะ loading (แสดง spinner แทนข้อความ + กดซ้ำไม่ได้)
  function setButtonLoading(btn, loading) {
    if (!btn) return;
    if (loading) {
      btn.dataset.originalDisabled = btn.disabled ? '1' : '0';
      btn.classList.add('btn-loading');
      btn.disabled = true;
    } else {
      btn.classList.remove('btn-loading');
      btn.disabled = btn.dataset.originalDisabled === '1';
    }
  }

  // Full-screen overlay: โชว์/ซ่อน พร้อมข้อความกำกับ (showProgress=true จะโชว์แถบความคืบหน้าแบบ indeterminate ด้วย
  // ใช้ตอนงานหนักที่ไม่รู้ % ที่แท้จริง เช่น นำเข้า Excel หลายแถว)
  function showOverlay(text, showProgress) {
    const el = document.getElementById('globalOverlay');
    if (!el) return;
    document.getElementById('globalOverlayText').innerText = text || 'กำลังทำงาน...';
    document.getElementById('globalOverlayProgress').style.display = showProgress ? 'block' : 'none';
    el.classList.add('show');
  }
  function hideOverlay() {
    const el = document.getElementById('globalOverlay');
    if (el) el.classList.remove('show');
  }

  // Skeleton: สร้าง HTML ของการ์ดวิชา/แถวตาราง แบบเทาไล่เฉด ไว้แสดงระหว่างรอข้อมูลจริง
  function skeletonCards(count) {
    let html = '';
    for (let i = 0; i < count; i++) {
      html += '<div class="subject-card">' +
        '<span class="skeleton skeleton-text short"></span>' +
        '<span class="skeleton skeleton-text" style="width:70%;"></span>' +
        '<span class="skeleton skeleton-text" style="width:50%;margin-top:14px;"></span>' +
        '</div>';
    }
    return html;
  }
  function skeletonRows(colCount, rowCount) {
    let html = '';
    for (let r = 0; r < rowCount; r++) {
      html += '<tr class="skeleton-row">';
      for (let c = 0; c < colCount; c++) {
        html += '<td><span class="skeleton skeleton-text"></span></td>';
      }
      html += '</tr>';
    }
    return html;
  }
</script>
