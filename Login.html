<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('Stylesheet'); ?>
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:16px; }
    .login-card {
      background:#fff; border-radius:16px; padding:40px 36px; max-width:400px; width:100%;
      box-shadow:0 4px 20px rgba(167,139,250,0.15); text-align:center;
    }
    @media (max-width: 480px) {
      .login-card { padding:28px 20px; border-radius:12px; }

    .login-card h1 { font-size:22px; margin:0 0 4px; color:#ec4899; }

      margin-bottom:12px; cursor:pointer; text-decoration:none; color:#4a3b52; transition:border-color 0.15s, background 0.15s;

    .role-btn .label { font-weight:600; font-size:15px; }
